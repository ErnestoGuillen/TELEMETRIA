<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menú de Servicios Alternos</title>
    <link rel="stylesheet" href="/Pagina/css/servicios.css" />
</head>

<body>
    <!-- Logos en las esquinas -->
    <img src="/Pagina/imagenes/logo agua y drenaje" alt="Logo SADM" class="logo-esquina logo-izq" />
    <img src="/Pagina/imagenes/Logo nuevo leon.png" alt="Logo NL" class="logo-esquina logo-der" />

    <!-- Botón de regreso -->
    <a href="/Pagina/html/index.html" class="back-btn">( INICIO )</a>

    <div class="container">
        <!-- Título centrado -->
        <h1 class="titulo">
            Menú de Servicios Alternos del<br />
            Departamento de Telemetría
        </h1>

        <!-- Telemetría -->
        <div class="telemetria-card card" aria-label="Telemetría">
            <img src="/Pagina/imagenes/antena.png" alt="Telemetría" />
        </div>

        <!-- Cuadros -->
        <div class="card-grid">
            <a href="#" class="card" aria-label="Reportes">
                <img src="/Pagina/imagenes/reportes.png" alt="Reportes" />
            </a>
            <a href="#" class="card" aria-label="Pozos">
                <img src="/Pagina/imagenes/pozos.png" alt="Pozos" />
            </a>
            <a href="#" class="card" aria-label="Gastos de Salidas en Tanques">
                <img src="/Pagina/imagenes/gastos.png" alt="Gastos de Salidas en Tanques" />
            </a>
            <a href="#" class="card" aria-label="Extracción Total">
                <img src="/Pagina/imagenes/extraccion.png" alt="Extracción Total" />
            </a>
            <a href="#" class="card" aria-label="Suministro Agua Potable">
                <img src="/Pagina/imagenes/suministro.png" alt="Suministro" />
            </a>
            <a href="#" class="card" aria-label="Estimación Salida/Demanda a RED">
                <img src="/Pagina/imagenes/estimacion.png" alt="Estimación Salida/Demanda a RED" />
            </a>
        </div>
    </div>
</body>

</html>
